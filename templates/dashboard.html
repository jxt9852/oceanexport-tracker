<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Export Tracker | Premium</title>
    <!-- Bootstrap 5 for structure -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .navbar {
            background: rgba(11, 15, 25, 0.8) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            background: -webkit-linear-gradient(45deg, var(--secondary-glow), var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Table Styling */
        .table {
            color: #cbd5e1;
            margin-bottom: 0;
        }
        
        .table-hover tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .table thead th {
            border-bottom: 1px solid var(--glass-border);
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            padding-bottom: 15px;
        }

        .table td {
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 10px;
            vertical-align: middle;
        }

        /* Gradient Badges */
        .badge-cleared {
            background: linear-gradient(45deg, #10b981, #059669);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
            color: white;
        }

        .badge-pending {
            background: linear-gradient(45deg, #f59e0b, #d97706);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
            color: white;
        }

        /* Premium Input & Button */
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            padding: 12px;
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--secondary-glow);
            box-shadow: 0 0 0 0.25rem rgba(79, 172, 254, 0.25);
            color: white;
        }

        .btn-premium {
            background: linear-gradient(45deg, var(--secondary-glow), var(--primary-glow));
            border: none;
            color: #000;
            font-weight: 700;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>
<body>

<!-- Premium Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark py-3 mb-5">
    <div class="container">
        <a class="navbar-brand fs-4" href="#">OceanTracker OS</a>
    </div>
</nav>

<div class="container">
    <div class="row g-4">
        <!-- Left Column: Container Tracker -->
        <div class="col-lg-8">
            <div class="glass-card p-4 h-100">
                <h5 class="fw-bold mb-4" style="color: #fff;">Active Shipments</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Container ID</th>
                                <th>Cut-off Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Jinja2 loop from your Python backend -->
                            {% for container in containers %}
                            <tr>
                                <td>
                                    <span class="fw-bold" style="color: #e2e8f0; font-family: monospace; font-size: 1.1rem;">
                                        {{ container.id }}
                                    </span>
                                </td>
                                <td>{{ container.cutoff }}</td>
                                <td>
                                    <!-- Premium Dynamic Badges -->
                                    {% if container.status == 'Cleared' %}
                                        <span class="badge badge-cleared rounded-pill px-3 py-2 fw-semibold">Cleared</span>
                                    {% else %}
                                        <span class="badge badge-pending rounded-pill px-3 py-2 fw-semibold">Pending</span>
                                    {% endif %}
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Column: S3 Upload -->
        <div class="col-lg-4">
            <div class="glass-card p-4 h-100">
                <h5 class="fw-bold mb-4" style="color: #fff;">Document Vault</h5>
                <p class="small text-muted mb-4">Securely push customs and load plans to Amazon S3.</p>
                
                <form action="/upload" method="POST" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="document" class="form-label text-light small fw-semibold">Select File</label>
                        <input class="form-control" type="file" id="document" name="document" required>
                    </div>
                    <button type="submit" class="btn btn-premium w-100">Upload to Cloud</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
